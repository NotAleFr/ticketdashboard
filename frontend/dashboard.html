<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel del sistema de gestión de tickets de laboratorio.">
    <title>Panel de tickets</title>
    <link rel="icon" href="/imgs/LOGO-OJO-BUHO-AMARILLO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./dashboard.css">
  </head>
  <body class="dashboard-page">
    <header class="dashboard-session-bar">
      <span id="dashboard-role-label">Cargando...</span>
      <button id="logout-button" type="button" aria-label="Cerrar sesión" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M10 17l5-5-5-5"></path>
          <path d="M15 12H3"></path>
          <path d="M12 3h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path>
        </svg>
      </button>
    </header>

    <main class="dashboard-shell">
      <section class="dashboard-content">
        <nav class="dashboard-grid" aria-label="Secciones del sistema">
          <a
            id="tickets-card"
            class="dashboard-card dashboard-card--tickets"
            href="./src/pages/gestion/gestion.html"
          >
            <p id="tickets-card-title" class="dashboard-card__title">Gestión de tickets</p>
            <img src="/imgs/iconos/lucide_ticket.svg" alt="">
          </a>

          <button
            id="admin-users-card"
            class="dashboard-card dashboard-card--secondary dashboard-card--users"
            type="button"
            disabled
            hidden
          >
            <span>
              <span class="dashboard-card__secondary-title">Administración de usuarios</span>
              <span class="dashboard-card__note">Integración pendiente</span>
            </span>
            <img src="/imgs/iconos/usuarios.svg" alt="">
          </button>

          <a
            id="reports-card"
            class="dashboard-card dashboard-card--secondary"
            href="./src/pages/gestion/reportes.html"
          >
            <span id="reports-card-title" class="dashboard-card__secondary-title">Historial de reportes</span>
            <img src="/imgs/iconos/historial.svg" alt="">
          </a>
        </nav>

        <p id="dashboard-message" class="dashboard-message" role="alert" hidden></p>
      </section>
    </main>

    <script type="module" src="./dashboard.js"></script>
  </body>
</html>

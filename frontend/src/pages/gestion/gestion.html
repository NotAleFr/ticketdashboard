<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de tickets</title>
  <link href="../login/login.css" rel="stylesheet" type="text/css" media="all">
</head>
<body>
  <main class="ticket-page">
    <section class="ticket-page__shell">
      <header class="ticket-page__header">
        <a class="ticket-page__back" href="../../../dashboard.html">← Panel</a>
        <h1>Gestión de tickets</h1>
        <a class="ticket-page__new-ticket" href="./nuevo.html">
          <span class="btn ticket-page__new-ticket-button">+ Nuevo ticket</span>
        </a>
      </header>

      <section class="whitebox ticket-page__panel">
        <div class="ticket-page__filters">
          <label for="status-filter">Estado
            <select id="status-filter">
              <option value="">Todos</option>
              <option value="Abierto">Abierto</option>
              <option value="En Proceso">En proceso</option>
              <option value="Resuelto">Resuelto</option>
              <option value="Cerrado">Cerrado</option>
            </select>
          </label>
          <input id="ticket-search" type="search" placeholder="Buscar por título o descripción" aria-label="Buscar tickets">
          <button id="refresh-tickets" class="btnsmall" type="button">Actualizar</button>
        </div>
      </section>

      <section class="whitebox ticket-page__panel">
        <p id="tickets-message" class="gris" role="status" aria-live="polite">Cargando tickets…</p>
        <div class="ticket-page__table-wrap">
        <table class="ticket-page__table">
          <thead>
            <tr>
              <th align="left">ID</th>
              <th scope="col">Título</th>
              <th scope="col">Aula</th>
              <th scope="col">Estado</th>
              <th scope="col">Creado</th>
            </tr>
          </thead>
          <tbody id="tickets-body"></tbody>
        </table>
        </div>
        <p id="tickets-count" class="gris"></p>
      </section>
    </section>
  </main>
  <script type="module" src="./gestion.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Tickets</title>
  <link href="./login.css" rel="stylesheet" type="text/css" media="all">
  <link rel="icon" type="image/png" href="/imgs/logo-buho-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <main class="auth">
    <div class="auth__frame">
      <div class="auth__card">
        <h1 class="auth__title">Iniciar sesión</h1>
        <p class="auth__lead">Ingresa tus datos para continuar.</p>

        <form id="login-form" class="auth__form">
          <div class="auth__field">
            <label for="email">Correo electrónico</label>
            <input id="email" class="auth__input" name="email" type="email" placeholder="tu@unison.mx"
              autocomplete="email" required>
          </div>

          <div class="auth__field">
            <label for="password">Contraseña</label>
            <input id="password" class="auth__input" name="password" type="password" data-reveal
              autocomplete="current-password" required>
          </div>

          <p class="auth__aside"><a class="auth__link" href="./recuperar.html">¿Olvidaste tu contraseña?</a></p>

          <p id="login-error" class="auth__message auth__message--error" role="alert" hidden></p>

          <input id="login-btn" class="auth__submit" type="submit" value="Entrar">
        </form>
      </div>
    </div>
  </main>
  <script type="module" src="./login.js"></script>
</body>

</html>

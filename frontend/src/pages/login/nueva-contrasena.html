<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña | Tickets</title>
  <link href="./login.css" rel="stylesheet" type="text/css" media="all">
  <link rel="icon" type="image/png" href="/imgs/logo-buho-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <main class="auth">
    <div class="auth__frame">
      <div class="auth__card">
        <h1 class="auth__title">Nueva contraseña</h1>

        <!-- Estado inicial: se valida el enlace del correo -->
        <p id="reset-checking" class="auth__message auth__message--info" role="status">Verificando enlace...</p>

        <!-- Se muestra si el enlace no es válido o ya expiró -->
        <div id="reset-invalid" hidden>
          <p class="auth__message auth__message--error" role="alert">
            El enlace no es válido o ya expiró. Solicita uno nuevo para continuar.
          </p>
          <p class="auth__footer"><a class="auth__link" href="./recuperar.html">Solicitar un enlace nuevo</a></p>
        </div>

        <!-- Se muestra cuando Supabase confirma la sesión de recuperación -->
        <form id="reset-form" class="auth__form" hidden>
          <p class="auth__lead">Escribe tu nueva contraseña (mínimo 8 caracteres).</p>

          <div class="auth__field">
            <label for="new-password">Nueva contraseña</label>
            <input id="new-password" class="auth__input" name="new-password" type="password" data-reveal
              autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>

          <div class="auth__field">
            <label for="confirm-password">Confirmar contraseña</label>
            <input id="confirm-password" class="auth__input" name="confirm-password" type="password" data-reveal
              autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>

          <p id="reset-error" class="auth__message auth__message--error" role="alert" hidden></p>

          <input id="reset-btn" class="auth__submit" type="submit" value="Guardar contraseña">
        </form>

        <p id="reset-success" class="auth__message auth__message--success" role="status" hidden></p>
        <a id="reset-continue" class="auth__submit" href="./login.html" hidden>Continuar</a>
      </div>
    </div>
  </main>
  <script type="module" src="./nueva-contrasena.js"></script>
</body>

</html>

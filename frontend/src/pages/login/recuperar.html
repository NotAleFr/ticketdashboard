<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Tickets</title>
  <link href="./login.css" rel="stylesheet" type="text/css" media="all">
  <link rel="icon" type="image/x-icon" href="/imgs/LOGO-OJO-BUHO-AMARILLO.png">
  <!-- Esto es para conectarse a la fuente-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <!-- Si lo quieren quitar, descarguen y coloquen la fuente en el proyecto -->
</head>

<body>
  <div class="ma columna" style="height: 100%;width: 100%;">
    <div class="azulCover ma columna" style="height: 70%; width: 70%; position: relative; box-sizing: border-box">
      <form id="recovery-form" class="whitebox ma columna" style="width: 100%; max-width: 30rem; box-sizing: border-box">

        <p class="titulo">Recuperar contraseña</p>
        <p class="gris">Ingresa tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>

        <label for="email">Correo electrónico</label>
        <input id="email" name="email" type="email" placeholder="tu@unison.mx" autocomplete="email" required>

        <p id="recovery-error" class="gris" role="alert" aria-live="polite" hidden></p>
        <p id="recovery-success" role="status" aria-live="polite" style="color: green;" hidden></p>

        <input id="recovery-btn" class="btn" style="width: 100%;" type="submit" value="Enviar enlace">

        <p style="margin-top: 1rem; align-self: center;">
          <a href="./login.html" style="color: #24398A; text-decoration: underline;">Volver a iniciar sesión</a>
        </p>
      </form>

      <div
        class="login-outline"
        aria-hidden="true"
        style="position: absolute; top: -30px; left: -30px; bottom: -30px; right: -30px; border: 5px #24398A solid; border-radius: 3rem; z-index: -1;">
      </div>

    </div>
  </div>
  <script type="module" src="./recuperar.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña | Tickets</title>
  <link href="./login.css" rel="stylesheet" type="text/css" media="all">
  <link rel="icon" type="image/png" href="/imgs/logo-buho-96.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>

<body>
  <main class="auth">
    <div class="auth__frame">
      <div class="auth__card">
        <h1 class="auth__title">Recuperar contraseña</h1>
        <p class="auth__lead">Ingresa tu correo y te enviaremos un enlace para crear una contraseña nueva.</p>

        <form id="recovery-form" class="auth__form">
          <div class="auth__field">
            <label for="email">Correo electrónico</label>
            <input id="email" class="auth__input" name="email" type="email" placeholder="tu@unison.mx"
              autocomplete="email" required>
          </div>

          <p id="recovery-error" class="auth__message auth__message--error" role="alert" hidden></p>
          <p id="recovery-success" class="auth__message auth__message--success" role="status" hidden></p>

          <input id="recovery-btn" class="auth__submit" type="submit" value="Enviar enlace">
        </form>

        <p class="auth__footer"><a class="auth__link" href="./login.html">Volver a iniciar sesión</a></p>
      </div>
    </div>
  </main>
  <script type="module" src="./recuperar.js"></script>
</body>

</html>
